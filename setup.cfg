[metadata]
name = advent-cli
version = 0.2.3a
description = Advent of Code command-line interface.
url = https://github.com/fergusch/advent-cli
author = Christian Ferguson
long_description = file: README.md
long_description_content_type = text/markdown
license = GPLv3

[options]
packages = advent_cli
python_requires = >=3.8
install_requires = 
    beautifulsoup4 >= 4.12.3
    markdownify >= 0.12.1
    pytz >= 2024.2
    requests >= 2.32.3
    tabulate >= 0.9.0
    termcolor >= 2.4.0
    windows-curses >= 2.4.0;platform_system=='Windows'

[options.extras_require]
test = 
    freezegun >= 1.5.1
    mock >= 5.1.0
    pytest >= 8.3.3
    pytest-cov >= 5.0.0
    pytest-clarity >= 1.0.1
    pytest-pycodestyle >= 2.3.1

[options.entry_points]
console_scripts = 
    advent = advent_cli.cli:main

[tool:pytest]
addopts = 
    --cov advent_cli 
    --cov-report xml
    --cov-fail-under 80
    --pycodestyle
    --cache-clear 
    -vv

[coverage:run]
omit = advent_cli/_*.py

[pycodestyle]
max-line-length = 95
exclude = 20[0-9][0-9]/*
